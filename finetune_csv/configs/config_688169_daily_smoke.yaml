data:
  data_path: "D:/workspace/Kronos/data/688169_train.csv"
  lookback_window: 128
  predict_window: 10
  max_context: 512
  clip: 5.0
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  tokenizer_epochs: 1
  basemodel_epochs: 1
  batch_size: 8
  log_interval: 25
  num_workers: 0
  seed: 688169
  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "D:/workspace/Kronos/weights/Kronos-Tokenizer-base"
  pretrained_predictor: "D:/workspace/Kronos/weights/Kronos-base"
  exp_name: "688169_daily_smoke"
  base_path: "D:/workspace/Kronos/outputs/finetuned"
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_688169_daily_smoke"
  description: "One epoch smoke test for 688169 daily fine-tuning"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
